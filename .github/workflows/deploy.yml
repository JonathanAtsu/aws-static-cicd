name: Deploy static file to s3 bucket

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy-to-s3:
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
        version: 2
        verbose: false
        arch: amd64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GIT_ARN }}
          aws-region: us-east-1

      - name: Upload static file to S3
        run: |
         # Upload all files in the current directory to the specified S3 bucket  
          aws s3 cp . s3://project.atsu.online/ --recursive
